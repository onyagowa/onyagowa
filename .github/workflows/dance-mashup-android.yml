name: Dance Mashup Android

on:
  push:
    paths:
      - "DanceMashup/**"
      - ".github/workflows/dance-mashup-android.yml"
  pull_request:
    paths:
      - "DanceMashup/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DanceMashup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: DanceMashup-apk
          path: DanceMashup/app/build/outputs/apk/release/*.apk
